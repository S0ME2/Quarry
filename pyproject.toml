[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "tender-system"
version = "0.1.0"
description = "Modular tender collection and matching foundations"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7,<1",
  "playwright>=1.48,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "pillow>=10,<12",
  "olefile>=0.47,<1",
  "cryptography>=44,<48",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-defusedxml>=0.7,<1",
    "httpx2>=2.13,<3", # Starlette TestClient requires this alongside runtime httpx.
    "xlwt>=1.3,<2",
    "types-openpyxl>=3.1.5.20261017",
    "types-xlrd>=2.0.0.20260518",
]

[project.scripts]
quarry-manual = "tender_system.operator.manual_cli:main"
tender-health = "tender_system.collection.diagnostics:main"

[tool.hatch.build.targets.sdist]
exclude = ["/.codex/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/tender_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "database: requires a dedicated PostgreSQL test database",
  "browser: requires Playwright Chromium; uses local fixtures only",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations", "tools"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
